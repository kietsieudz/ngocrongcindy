<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<title>Ngọc Rồng</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap');

  :root{
    --bg: #101014;
    --bg-soft: #17171d;
    --line: rgba(255,255,255,0.08);
    --text: #ececef;
    --text-dim: #8b8b93;
    --accent: #e0a530; /* dragon-pearl gold */
    --accent-soft: rgba(224,165,48,0.14);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Manrope', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    min-height: 100svh;
    display: flex;
    justify-content: center;
    padding: 64px 20px 40px;
  }

  /* faint radial glow, single accent, no gradients-on-gradients */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(560px 420px at 50% -8%, rgba(224,165,48,0.10), transparent 70%);
    pointer-events: none;
  }

  .page {
    width: 100%;
    max-width: 460px;
    position: relative;
    z-index: 1;
  }

  /* signature: a single orb, referencing "ngọc" (pearl/orb) — one bold move, rest kept quiet */
  .orb {
    width: 64px;
    height: 64px;
    margin: 0 auto 24px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 32% 28%, #fbe3ad 0%, var(--accent) 42%, #7a5717 100%);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.06),
      0 12px 30px -8px rgba(224,165,48,0.45);
  }

  .eyebrow {
    text-align: center;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 10px;
  }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 30px;
    font-weight: 700;
    text-align: center;
    letter-spacing: -0.01em;
    margin: 0 0 8px;
  }

  .sub {
    text-align: center;
    color: var(--text-dim);
    font-size: 14.5px;
    line-height: 1.5;
    margin: 0 0 34px;
    max-width: 340px;
    margin-left: auto;
    margin-right: auto;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 40px;
  }

  .link {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 15px 18px;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 14px;
    text-decoration: none;
    color: var(--text);
    transition: border-color 0.15s ease, transform 0.15s ease, background 0.15s ease;
  }

  .link:hover {
    border-color: rgba(224,165,48,0.45);
    background: #1b1b22;
    transform: translateY(-1px);
  }

  .link:active { transform: translateY(0); }

  .link-index {
    flex: none;
    width: 30px;
    height: 30px;
    border-radius: 8px;
    background: var(--accent-soft);
    color: var(--accent);
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .link-text {
    flex: 1;
    font-weight: 600;
    font-size: 15px;
  }

  .link-arrow {
    flex: none;
    color: var(--text-dim);
    font-size: 16px;
    transition: transform 0.15s ease, color 0.15s ease;
  }

  .link:hover .link-arrow {
    color: var(--accent);
    transform: translateX(2px);
  }

  footer {
    text-align: center;
    color: var(--text-dim);
    font-size: 12.5px;
    letter-spacing: 0.02em;
  }

  @media (prefers-reduced-motion: reduce) {
    .link { transition: none; }
  }
</style>
</head>
<body>
  <div class="page">
    <div class="orb"></div>
    <div class="eyebrow">Server sắp mở test</div>
    <h1>Ngọc Rồng</h1>
    <p class="sub">Tranh thủ tham gia nhóm để nhận thông báo mở server sớm nhất.</p>

    <div class="links">
      <a class="link" href="https://zalo.me/g/acxvjw835" target="_blank" rel="noopener">
        <span class="link-index">1</span>
        <span class="link-text">Nhóm Chat 1</span>
        <span class="link-arrow">→</span>
      </a>
      <a class="link" href="https://zalo.me/g/mftkmn654" target="_blank" rel="noopener">
        <span class="link-index">2</span>
        <span class="link-text">Nhóm Chat 2</span>
        <span class="link-arrow">→</span>
      </a>
      <a class="link" href="https://zalo.me/g/jcssww622" target="_blank" rel="noopener">
        <span class="link-index">3</span>
        <span class="link-text">Nhóm Chat 3</span>
        <span class="link-arrow">→</span>
      </a>
      <a class="link" href="https://zalo.me/g/cxcyjr130" target="_blank" rel="noopener">
        <span class="link-index">4</span>
        <span class="link-text">Nhóm Chat 4</span>
        <span class="link-arrow">→</span>
      </a>
      <a class="link" href="https://zalo.me/g/hfl2vzndgjskd0egmdmu" target="_blank" rel="noopener">
        <span class="link-index">5</span>
        <span class="link-text">Nhóm Chat 5</span>
        <span class="link-arrow">→</span>
      </a>
      <a class="link" href="https://zalo.me/g/ugyxtyh8qgypyzgbqjuk" target="_blank" rel="noopener">
        <span class="link-index">6</span>
        <span class="link-text">Nhóm Chat 6</span>
        <span class="link-arrow">→</span>
      </a>
    </div>

    <footer>Ngọc Rồng · tất cả nhóm chat chính thức</footer>
  </div>
</body>
</html>
